name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Circom
        id: circom-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/circom
          key: circom-2.2.3-${{ runner.os }}-${{ runner.arch }}

      - name: Install Circom
        if: steps.circom-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/iden3/circom.git --tag v2.2.3 circom

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check toolchain
        run: pnpm check:toolchain

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
