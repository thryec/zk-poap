name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Circom
        id: circom-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/circom
          key: circom-2.2.3-${{ runner.os }}-${{ runner.arch }}

      - name: Install Circom
        if: steps.circom-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/iden3/circom.git --tag v2.2.3 circom

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check toolchain
        run: pnpm check:toolchain

      - name: Cache Powers of Tau
        uses: actions/cache@v4
        with:
          path: .cache/ptau
          key: ptau16-snarkjs-0.7.6-6a6277a2f74e1073601b4f9fed6e1e55226917efb0f0db8a07d98ab01df1ccf43eb0e8c3159432acd4960e2f29fe84a4198501fa54c8dad9e43297453efec125

      - name: Build development proving artifacts
        run: pnpm --filter @pop/circuits artifacts:dev

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
